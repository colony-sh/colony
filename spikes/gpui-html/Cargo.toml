# The GPUI-free half of the spike. `crates/gpui-view` is a separate workspace so that
# building and testing these two crates never has to fetch or compile GPUI.
[workspace]
resolver = "2"
members = ["crates/paint", "crates/doc"]
exclude = ["crates/gpui-view"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyrender = "0.15"
blitz-dom = "=0.3.0-beta.5"
blitz-html = "=0.3.0-beta.5"
blitz-paint = "=0.3.0-beta.5"
blitz-traits = "=0.3.0-beta.5"
kurbo = "0.13"
peniko = "0.6"
